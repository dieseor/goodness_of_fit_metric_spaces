name: R - CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: ['4.4.0', '4.4.2']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: Install system libraries required by renv packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev libnetcdf-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev

      - name: Install NetCDF on macOS
        if: runner.os == 'macOS'
        run: brew install netcdf

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Build and check the package
        run: |
          R CMD build .
          R CMD check --as-cran --no-manual gofmetric_*.tar.gz || {
            if [ -f gofmetric.Rcheck/00install.out ]; then
              tail -n 120 gofmetric.Rcheck/00install.out
            fi
            exit 1
          }

      - name: Check installed R and C++ paths
        run: |
          R CMD INSTALL gofmetric_*.tar.gz
          Rscript paper/check_package.R

      - name: Run the tests used for the paper
        run: |
          for test in \
            test_section6_new_scenarios \
            test_sunspots_joint_time_space \
            test_small_circle_bootstrap \
            ; do
            echo "== $test"
            Rscript -e "testthat::test_file('scripts/legacy_testthat/${test}.R', stop_on_failure = TRUE)"
          done

      - name: Measure package coverage
        if: runner.os == 'Linux' && matrix.r == '4.4.2'
        run: |
          Rscript -e 'if (!requireNamespace("covr", quietly = TRUE)) install.packages("covr")'
          Rscript -e 'x <- covr::package_coverage(type = "tests"); p <- covr::percent_coverage(x); cat(sprintf("Coverage: %.2f%%\n", p)); if (p < 85) stop("Coverage below 85%"); covr::to_cobertura(x, "coverage.xml")'

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.r == '4.4.2'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  cran-check:
    name: CRAN check (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install PDF manual tools
        run: |
          tlmgr install courier makeindex
          kpsewhich pcrr8t.tfm
          command -v makeindex
      - name: Install HTML validator
        run: sudo apt-get install --yes tidy
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::V8
      - name: Build and check the full tarball
        run: |
          R CMD build .
          R CMD check --as-cran gofmetric_*.tar.gz || check_failed=1
          if [ "${check_failed:-0}" -ne 0 ] || grep -Eq 'Status:.*(WARNING|ERROR)' gofmetric.Rcheck/00check.log; then
            R CMD Rd2pdf --no-clean --no-preview . || true
            for log in gofmetric.Rcheck/gofmetric-manual.log gofmetric.Rcheck/Rdlatex.log; do
              if [ -f "$log" ]; then
                grep -n -B 4 -A 4 -m 8 '^!' "$log" || true
                tail -n 40 "$log"
              fi
            done
            exit 1
          fi

  fresh-install:
    name: Fresh install (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release, oldrel]
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install system GSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          upgrade: 'TRUE'
          cache: false
      - name: Check and install with current dependencies
        shell: bash
        run: |
          R CMD build .
          R CMD check --no-manual gofmetric_*.tar.gz
          R CMD INSTALL gofmetric_*.tar.gz
          Rscript paper/check_package.R
