name: R - CI (renv)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system libraries required by renv packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev libnetcdf-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Build and check the package
        run: |
          R CMD build .
          R CMD check --no-manual dpgof_*.tar.gz

      - name: Check installed R and C++ paths
        run: |
          R CMD INSTALL dpgof_*.tar.gz
          Rscript paper/check_package.R

      - name: Run the tests used for the paper
        run: |
          for test in \
            test_cpp_distance_profile_backend \
            test_fast_multiplier_cpp_kernel \
            test_multiplier_bootstrap \
            test_restricted_spiked_normal_model_spec \
            test_normal_sigma_Id_model_spec \
            test_logistic_gaussian_sigma_shape_model_spec \
            test_vmf_fixed_kappa_model_spec \
            test_hvmf_hq_model_spec \
            test_section6_new_scenarios \
            test_sunspots_joint_time_space \
            test_cardioid_model_spec \
            test_small_circle_bootstrap \
            ; do
            echo "== $test"
            Rscript -e "testthat::test_file('tests/testthat/${test}.R', stop_on_failure = TRUE)"
          done

      - name: Check renv status
        run: Rscript -e 'renv::status()'
