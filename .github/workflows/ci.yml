name: R - CI (renv)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system libraries required by renv packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev libnetcdf-dev libglu1-mesa-dev

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Build and check the package
        run: |
          R CMD build .
          R CMD check --no-manual dpgof_*.tar.gz

      - name: Check installed R and C++ paths
        run: |
          R CMD INSTALL dpgof_*.tar.gz
          Rscript --vanilla paper/check_package.R

      - name: Test optional C++ distance-profile backend
        run: Rscript -e 'testthat::test_file("tests/testthat/test_cpp_distance_profile_backend.R", stop_on_failure = TRUE)'

      - name: Test the retained cardioid functions
        run: Rscript -e 'testthat::test_file("tests/testthat/test_cardioid_model_spec.R", stop_on_failure = TRUE)'

      - name: Check renv status
        run: Rscript -e 'renv::status()'
