name: R - CI (renv)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system libraries required by renv packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev libnetcdf-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Build and check the package
        run: |
          R CMD build .
          R CMD check --as-cran --no-manual gofmetric_*.tar.gz

      - name: Check installed R and C++ paths
        run: |
          R CMD INSTALL gofmetric_*.tar.gz
          Rscript paper/check_package.R

      - name: Run the tests used for the paper
        run: |
          for test in \
            test_section6_new_scenarios \
            test_sunspots_joint_time_space \
            test_small_circle_bootstrap \
            ; do
            echo "== $test"
            Rscript -e "testthat::test_file('scripts/legacy_testthat/${test}.R', stop_on_failure = TRUE)"
          done

      - name: Measure package coverage
        if: runner.os == 'Linux'
        run: |
          Rscript -e 'if (!requireNamespace("covr", quietly = TRUE)) install.packages("covr")'
          Rscript -e 'covr::codecov(coverage = covr::package_coverage(type = "tests"))'
